name: parser-tests

on:
  push:
    paths:
      - 'parse/**'
      - '.github/workflows/parse-tests.yml'
  pull_request:
    paths:
      - 'parse/**'
      - '.github/workflows/parse-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: parse/requirements.txt
      - run: python -m pip install -r parse/requirements.txt
      - run: python -m unittest discover -s parse/tests -v
