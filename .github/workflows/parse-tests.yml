name: parser-tests

on:
  push:
    paths:
      - 'parse/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - 'parse/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-offline:
    name: offline unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install "${{ matrix.python-version }}"
      - run: uv sync --locked --python "${{ matrix.python-version }}"
      - name: Run unit tests without uv network access
        run: uv run --frozen --offline --python "${{ matrix.python-version }}" python -m unittest discover -s parse/tests -v

  live-site-smoke:
    name: bounded live-site smoke
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install '3.13'
      - run: uv sync --locked --python '3.13'
      - name: Fetch one listing and one article, then validate CLI output
        run: uv run --frozen --python '3.13' python parse/tests/live_smoke.py
