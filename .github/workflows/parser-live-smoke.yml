name: parser-live-smoke

# Workflow-only edits intentionally do not self-trigger an upstream request.
# Validate configuration locally with actionlint; an operator can also use the
# explicit manual trigger when an upstream smoke request is appropriate.
on:
  push:
    paths:
      - 'parse/corpus.py'
      - 'parse/update.py'
      - 'parse/tests/live_smoke.py'
      - 'parse/tests/fixtures/**'
      - '!parse/tests/fixtures/worker-*'
  pull_request:
    paths:
      - 'parse/corpus.py'
      - 'parse/update.py'
      - 'parse/tests/live_smoke.py'
      - 'parse/tests/fixtures/**'
      - '!parse/tests/fixtures/worker-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-site-smoke:
    name: bounded live-site smoke
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install '3.13'
      - run: uv sync --locked --python '3.13'
      - name: Fetch one listing and one article, then validate CLI output
        run: uv run --frozen --python '3.13' python parse/tests/live_smoke.py
