name: worker-core-tests

on:
  push:
    paths:
      - 'worker/**'
      - 'parse/export_worker.py'
      - 'parse/corpus.py'
      - 'parse/tests/fixtures/worker-*.json'
      - 'parse/tests/fixtures/worker-*.bin'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/worker-core-tests.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'parse/export_worker.py'
      - 'parse/corpus.py'
      - 'parse/tests/fixtures/worker-*.json'
      - 'parse/tests/fixtures/worker-*.bin'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/worker-core-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.12.18'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install '3.13'
      - run: uv sync --locked --python '3.13'
      - name: Generate tiny assets with the Python exporter
        run: uv run --frozen --offline --python '3.13' python worker/scripts/generate-test-assets.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: worker
      - run: npm run typecheck
        working-directory: worker
      - run: npm test
        working-directory: worker
